name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check xbsl-meta-add coverage render
        run: python scripts/render_xbsl_meta_add_coverage.py --check
      - name: Run tests
        run: python -m pytest
